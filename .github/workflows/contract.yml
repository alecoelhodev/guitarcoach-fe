name: API contract

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-types:
    runs-on: ubuntu-latest
    steps:
      - name: Check out frontend
        uses: actions/checkout@v6

      - name: Check out backend
        uses: actions/checkout@v6
        with:
          repository: alecoelhodev/guitarcoach
          path: backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Runs before the `expo customize` step below, which rewrites
      # tsconfig.json and would otherwise influence the check.
      - name: Check formatting and import order
        run: npx biome ci .

      # Expo generates `expo-env.d.ts` (which pulls in expo/types, providing the
      # ambient `declare module '*.css'` that `import '@/global.css'` needs) and
      # `.expo/types` (expo-router's typed routes) only when the dev server
      # starts. Both are gitignored, so a fresh CI checkout has neither and
      # `tsc --noEmit` fails on the CSS import while silently not checking
      # routes at all. This is the command Expo documents for exactly this case
      # — see https://docs.expo.dev/router/reference/typed-routes/ ("generate
      # these types without initiating the development server ... on a CI").
      - name: Generate Expo ambient and typed-route declarations
        run: npx expo customize tsconfig.json

      - name: Regenerate types from backend/openapi.json and verify no drift
        run: npm run api:types:check
        env:
          BACKEND_OPENAPI_PATH: backend/openapi.json

      # Biome's linter is deliberately off (see biome.jsonc), so this is the only thing
      # checking the React Compiler hook rules that `app.config.ts`'s
      # `experiments.reactCompiler: true` depends on, plus eslint-plugin-expo's
      # `use-dom-exports` / `no-env-var-destructuring` / `no-dynamic-env-var`. The workflow
      # ran biome, tsc and jest and left all of that ungated.
      - name: Lint
        run: npx expo lint

      # --coverage is what makes jest.config.js's coverageThreshold gate the PR; without
      # it the floor is inert. Costs roughly 15s over a plain run.
      - name: Run tests
        run: npm test -- --coverage --ci

      # `if: always()` is the point: the run that fails the 80% floor is the one whose report
      # is worth reading, and a failed step would otherwise skip this. `coverage/` holds only
      # the HTML report — see `coverageReporters` in jest.config.js.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
